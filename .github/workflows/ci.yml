name: mcp-moat CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        # No cache on tag builds: release binaries are built from a clean state.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        shell: bash
        run: .github/scripts/run-with-annotations.sh "clippy" cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        shell: bash
        run: .github/scripts/run-with-annotations.sh "tests" cargo test --workspace --all-targets --locked --no-fail-fast

      - name: Build release binaries
        run: cargo build --workspace --release --locked

  cargo-audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Check Cargo.lock against the RustSec advisory database
        run: cargo audit

  real-server:
    name: Real MCP servers (filesystem, git, everything)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the git MCP server
        run: python -m pip install mcp-server-git==2026.11.11
      - name: Build moat
        run: cargo build --release --locked --bin moat
      - name: Run moat in front of the real servers
        run: python scripts/real_server_check.py target/release/moat

  build:
    name: Build ${{ matrix.target }}
    needs: [ test, real-server, cargo-audit ]
    # Tags build the release. A manual run (workflow_dispatch) builds the same archives as a dry run
    # (no release is created for it).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest Ubuntu available so that it runs on more Linux systems (glibc 2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: moat-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: moat-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: moat-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: moat-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$crate_version" ] || [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match workspace.package.version '$crate_version' in Cargo.toml"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $crate_version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin moat --target ${{ matrix.target }}

      - name: Verify binary architecture
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/moat"
          file "$bin"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) file "$bin" | grep -q "x86-64" ;;
            aarch64-apple-darwin)     test "$(lipo -archs "$bin")" = "arm64" ;;
            x86_64-apple-darwin)      test "$(lipo -archs "$bin")" = "x86_64" ;;
          esac

      - name: Smoke test binary
        # The x86_64 macOS binary is cross-built on an arm64 runner. It is run in the next step.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/moat"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" --help > /dev/null

      - name: Smoke test x86_64 macOS binary under Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          bin="target/${{ matrix.target }}/release/moat"
          arch -x86_64 "$bin" --version
          arch -x86_64 "$bin" --help > /dev/null

      - name: Package Linux / macOS archive
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/moat dist/
          cp LICENSE README.md SECURITY.md moat.toml dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Package Windows archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/moat.exe, LICENSE, README.md, SECURITY.md, moat.toml -Destination dist
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ build, cargo-audit ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > release-notes.md
          cat release-notes.md
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then test -s release-notes.md; fi
          printf '\n### Install\n\n```bash\ncargo install --locked mcp-moat --version %s\n```\n\nBinaries for Linux, macOS and Windows are attached below. Check them against `SHA256SUMS`.\n' "$version" >> release-notes.md

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create SHA256SUMS
        working-directory: artifacts
        run: |
          ls -l
          sha256sum moat-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: mcp-moat ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/moat-*
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
