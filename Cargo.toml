[workspace]
resolver = "2"
members = [
    "crates/mcp-moat-core",
    "crates/mcp-moat-proxy",
    "crates/mcp-moat-tty",
    "crates/mcp-moat-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["Gencay"]
license = "MIT"
repository = "https://github.com/gencay-e/mcp-moat"
homepage = "https://github.com/gencay-e/mcp-moat"
readme = "README.md"
description = "Stdio policy proxy for Model Context Protocol (MCP) servers"
keywords = ["mcp", "security", "proxy", "cli", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
similar = "2.6"
crossterm = "0.28"
aho-corasick = "1.1"
regex = "1.10"
