[package]
name = "mcp-moat"
description = "Zero-Trust Stdio/TTY Runtime Firewall and Proxy for Model Context Protocol (MCP)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "moat"
path = "src/main.rs"

[features]
default = []
# sse-proxy and sse-bridge are experimental and not built by default.
experimental-sse = []

[dependencies]
mcp-moat-core = { path = "../mcp-moat-core", version = "0.1.0" }
mcp-moat-proxy = { path = "../mcp-moat-proxy", version = "0.1.0" }
mcp-moat-tty = { path = "../mcp-moat-tty", version = "0.1.0" }
clap.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
