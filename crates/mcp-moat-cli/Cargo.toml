[package]
name = "mcp-moat"
description = "Stdio policy proxy for Model Context Protocol (MCP) servers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/gencay-e/mcp-moat#readme"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "moat"
path = "src/main.rs"

[features]
default = []
# sse-proxy and sse-bridge are experimental and not built by default.
experimental-sse = []

[dependencies]
mcp-moat-core = { path = "../mcp-moat-core", version = "0.2.3" }
mcp-moat-proxy = { path = "../mcp-moat-proxy", version = "0.2.3" }
mcp-moat-tty = { path = "../mcp-moat-tty", version = "0.2.3" }
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
