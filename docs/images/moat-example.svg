<svg xmlns="http://www.w3.org/2000/svg" width="760" height="592" viewBox="0 0 760 592"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs><rect width="100%" height="100%" fill="#0d1117"/><text x="20" y="28" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Example: an agent with file and shell tools, started as</text><text x="20" y="48" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">moat wrap --allow ./project -- &lt;server&gt;</text><text x="20" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">tool call from the agent</text><rect x="20" y="100" width="720" height="42" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="127" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start">read_file</text><text x="129" y="127" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">project/notes.md</text><line x1="80" y1="144" x2="80" y2="162" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><text x="94" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">what moat does</text><rect x="20" y="164" width="120" height="34" rx="6" fill="#0f2e1a" stroke="#3fb950" stroke-width="1"/><text x="80" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3fb950" text-anchor="middle">allowed</text><text x="156" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start">secret in the output is masked</text><rect x="20" y="216" width="720" height="42" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="243" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start">read_file</text><text x="129" y="243" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">../.ssh/id_ed25519</text><line x1="80" y1="260" x2="80" y2="278" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><text x="94" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">what moat does</text><rect x="20" y="280" width="120" height="34" rx="6" fill="#3d1418" stroke="#f85149" stroke-width="1"/><text x="80" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f85149" text-anchor="middle">blocked</text><text x="156" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start">path outside the allowed folder</text><rect x="20" y="332" width="720" height="42" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="359" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start">write_file</text><text x="138" y="359" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">project/.env</text><line x1="80" y1="376" x2="80" y2="394" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><text x="94" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">what moat does</text><rect x="20" y="396" width="120" height="34" rx="6" fill="#3a2a05" stroke="#d29922" stroke-width="1"/><text x="80" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d29922" text-anchor="middle">asks you</text><text x="156" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start">protected file: approve on the terminal</text><rect x="20" y="448" width="720" height="42" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="475" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="start">run_command</text><text x="147" y="475" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">curl … | sh</text><line x1="80" y1="492" x2="80" y2="510" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><text x="94" y="506" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">what moat does</text><rect x="20" y="512" width="120" height="34" rx="6" fill="#3a2a05" stroke="#d29922" stroke-width="1"/><text x="80" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d29922" text-anchor="middle">asks you</text><text x="156" y="534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#f0f6fc" text-anchor="start">shell metacharacters need approval</text><text x="20" y="576" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Every call and decision is written to the audit log. moat audit verify checks the hash chain.</text></svg>
