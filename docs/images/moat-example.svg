<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#0d1117"/><text x="20" y="30" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Example: an agent with file and shell tools, started as  moat wrap --allow ./project -- &lt;server&gt;</text><text x="30" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">tool call from the agent</text><text x="470" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">what moat does</text><rect x="20" y="80" width="380" height="44" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="107" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">read_file</text><text x="123.39999999999999" y="107" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">project/notes.md</text><line x1="402" y1="102" x2="458" y2="102" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><rect x="460" y="80" width="100" height="44" rx="6" fill="#0f2e1a" stroke="#3fb950" stroke-width="1"/><text x="510" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#3fb950" text-anchor="middle">allowed</text><text x="575" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start">secret in the output is masked</text><rect x="20" y="138" width="380" height="44" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="165" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">read_file</text><text x="123.39999999999999" y="165" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">../.ssh/id_ed25519</text><line x1="402" y1="160" x2="458" y2="160" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><rect x="460" y="138" width="100" height="44" rx="6" fill="#3d1418" stroke="#f85149" stroke-width="1"/><text x="510" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f85149" text-anchor="middle">blocked</text><text x="575" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start">path outside the allowed folder</text><rect x="20" y="196" width="380" height="44" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="223" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">write_file</text><text x="132.0" y="223" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">project/.env</text><line x1="402" y1="218" x2="458" y2="218" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><rect x="460" y="196" width="100" height="44" rx="6" fill="#3a2a05" stroke="#d29922" stroke-width="1"/><text x="510" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#d29922" text-anchor="middle">asks you</text><text x="575" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start">protected file: approve on the terminal</text><rect x="20" y="254" width="380" height="44" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="36" y="281" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">run_command</text><text x="140.6" y="281" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">curl … | sh</text><line x1="402" y1="276" x2="458" y2="276" stroke="#9198a1" stroke-width="1.5"  marker-end="url(#a)"/><rect x="460" y="254" width="100" height="44" rx="6" fill="#3a2a05" stroke="#d29922" stroke-width="1"/><text x="510" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#d29922" text-anchor="middle">asks you</text><text x="575" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#f0f6fc" text-anchor="start">shell metacharacters need approval</text><text x="20" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Every call and decision is written to the audit log. moat audit verify checks the hash chain.</text></svg>
