# ==============================================================================
# mcp-moat Security Configuration (moat.toml)
# MCP stdio policy proxy
# ==============================================================================

# Allowed root paths for filesystem access (path jailing).
# Relative paths are resolved against the current working directory.
# Paths outside this boundary are blocked.
allowed_paths = ["."]

# Blocks tools classified as modifying by the built-in and configured tool-name rules.
# Does not sandbox the server process.
read_only = false

# Require operator approval (via the terminal) for file write actions,
# even if the target file is located inside an allowed path.
# Sensitive system files (e.g., moat.toml, .git, .env) ALWAYS require approval regardless.
require_approval_on_write = false

# Shell command patterns that are blocked (case-insensitive).
blocked_commands = [
    "rm -rf /",
    ":(){ :|:& };:",
    "mkfs",
    "dd if=/dev/zero",
    "format c:",
    "powershell -enc",
]

# Tools that are allowed without operator approval (after the path checks).
# Tools of @modelcontextprotocol/server-filesystem are recognized by exact name. Other unlisted
# tools are blocked, or need operator approval if they look like they modify files.
# custom_modifying_tools (not set here) only marks a tool as modifying (read_only blocks it).
# It never allows the tool.
always_allow_tools = [
    "list_directory",
    "read_file",
    "search_files",
    "grep",
]

# Tools whose names look like file tools (read_*, get_*, list_*, ...) but that take no path,
# for example "get-sum". Without this list a call of such a tool is blocked, because moat
# cannot find a path to check. This does not allow the tool: list it in always_allow_tools too.
# List only tools you know.
# non_file_tools = ["get-sum"]

# Argument names that look like paths but are not (for example a git revision called "target").
# Ignored for every tool. The git preset already sets the common ones for the git tools only.
# ignore_path_keys = ["target"]

# Audit log with SHA-256 hash chain (tamper-evident, not tamper-proof).
# When set, MCP messages, decisions and DLP redactions
# are recorded to this file.
# audit_log = ".moat/audit.jsonl"

# Granularity of forensic audit logging: "full", "decisions_only", or "violations_only"
audit_level = "full"

# ==============================================================================
# Token-Moat & Context Budget (Schema Slimming & Output Guard)
# ==============================================================================

# Compact bloated `tools/list` JSON schemas on-the-fly ($schema, title, examples,
# verbose descriptions) and automatically prune modifying tools when `read_only = true`.
compact_schemas = false

# Optional maximum byte budget per tool/resource text output to prevent context-window
# token explosions (e.g., 16384 for 16 KB). Omit or comment out for unlimited output.
# max_output_bytes = 16384

# Hide specific tools from `tools/list` discovery AND block them on `tools/call`.
hidden_tools = []

# Only the standard MCP client-to-server methods are forwarded (initialize, ping, tools/*,
# resources/*, prompts/*, completion/complete, logging/setLevel, notifications/initialized,
# notifications/cancelled, notifications/progress, notifications/roots/list_changed).
# Any other method is refused with -32601 (notifications are dropped). List extra methods
# of your server here (exact match), for example a vendor extension.
# allowed_methods = ["x/vendor_method"]

# ==============================================================================
# Server Profiles & Presets
# Preconfigured security profiles can be invoked via CLI `--preset <name>`
# Built-in presets available: filesystem, git, fetch, sqlite, memory
# Custom presets can be defined or overridden below:
# ==============================================================================
# [presets.custom_git]
# read_only = false
# blocked_commands = ["git push --force", "git reset --hard", "git clean -fdx"]
# always_allow_tools = ["git_status", "git_diff", "git_log"]
# custom_modifying_tools = ["git_commit", "git_checkout"]

